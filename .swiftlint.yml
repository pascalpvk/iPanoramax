included:
  - App/iPanoramax
  - Packages

excluded:
  - .build
  - DerivedData
  - Packages/**/.build

disabled_rules:
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120
  error: 160
  ignores_comments: true

# Un `enum CodingKeys` dans un type imbriqué fait deux niveaux : c'est la
# forme idiomatique d'un modèle Codable structuré, pas une odeur de code.
nesting:
  type_level: 2

type_body_length:
  warning: 300

file_length:
  warning: 500

identifier_name:
  min_length: 2
  excluded: [id, x, y, z]
