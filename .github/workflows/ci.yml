name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: PanoramaxKit — build & tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version de Swift
        run: swift --version

      - name: Build
        working-directory: Packages/PanoramaxKit
        run: swift build -v

      - name: Tests
        working-directory: Packages/PanoramaxKit
        run: swift test -v

      - name: Build de panoramax-probe
        working-directory: Tools/panoramax-probe
        run: swift build -v

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict

